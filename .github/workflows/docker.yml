# Builds the Docker images and publishes them to GitHub Container Registry
# (ghcr.io/<owner>/<repo>:gpu and :cpu) when a version tag is pushed, or on demand.
# Users can then skip the local build: set IMAGE_REPO=ghcr.io/<owner>/<repo> in .env.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [gpu, cpu]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the CUDA devel image is large)
        if: matrix.target == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        # Release tags (v1.2.3) move the :gpu / :cpu tags; a manual run from a branch only pushes a dev tag.
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          t=${{ matrix.target }}
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=$repo:$t,$repo:$t-${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$repo:$t-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            BUILD_JOBS=4
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
